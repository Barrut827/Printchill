<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="prc-token" content="__TOKEN__"><title>PrintChill · Workspace</title><link rel="stylesheet" href="/style.css">
<header><strong>PrintChill</strong><span>Engineering workspace · 0.2.5</span><button id="settings">Settings</button></header>
<p id="notice" role="status" aria-live="polite"></p><main><aside><div class="row library-title"><h1>Part library</h1><button id="create">+ Import Part</button></div><section class="rail" aria-label="Library search"><label>Find parts<input id="search" type="search" placeholder="Name, number or #tag + material"></label>
<details><summary>Filters &amp; saved searches</summary><div class="filters"><label>Registered file<select id="role"><option value="">Any file</option><option>CAD</option><option>STL</option><option>3MF</option></select></label><label>Print material<input id="material" placeholder="e.g. PETG"></label><label>Print period<select id="days"><option value="">Any date</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label><label><input type="checkbox" id="printed"> Has print report</label></div><div class="row"><select aria-label="Saved search" id="saved"></select><button id="save-search">Save search</button></div></details>
<section hidden class="tag-section"><h3>Tags</h3><div id="side-tags" class="badges"></div></section>
</section><section class="collection"><div class="row toolbar"><span id="count" role="status"></span><select id="sort" aria-label="Sort parts"><option value="name">Name A–Z</option><option value="number">Part number</option></select><button id="layout">Table view</button></div><nav id="library" aria-label="Parts"></nav></section></aside><article id="detail"></article></main>
<dialog id="dialog" aria-labelledby="title"><form id="form"><h2 id="title"></h2><div id="fields"></div><p id="error" role="alert"></p><footer><button type="button" id="cancel">Close</button><button id="submit">Save</button></footer></form></dialog>
<script type="module" src="/app.js"></script></html>
