<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintChill · Workspace</title><meta name="prc-token" content="__TOKEN__"><link rel="stylesheet" href="/style.css"></head>
<body>
<aside id="sidebar">
  <a class="brand" href="#library"><span class="mark">P</span><span>PrintChill<small>YOUR ENGINEERING WORKSPACE</small></span></a>
  <nav aria-label="Main navigation"><button id="nav-library" class="nav active">▦ <span>Part library</span><span id="part-count"></span></button><button id="nav-reports" class="nav">▤ <span>Print reports</span><span id="report-count"></span></button><button id="settings" class="nav">⚙ <span>Settings</span></button></nav>
<section><label class="section-label" for="search">FIND A PART</label><input id="search" type="search" placeholder="Name, number or #tag + material"><details><summary>Filters &amp; saved searches</summary><label>Project parameter<select id="attribute"><option value="">Any project parameter</option></select></label><label>Parameter value contains<input id="attribute-value"></label><label>Registered file<select id="role"><option value="">Any file</option><option>CAD</option><option>STL</option><option>3MF</option></select></label><label>Print material<input id="material" placeholder="e.g. PETG"></label><label>Print period<select id="days"><option value="">Any date</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label><label class="check"><input type="checkbox" id="printed"> Has print report</label><button id="clear-filters" class="text-button">Clear filters</button></details></section>
<section><div class="section-heading"><span class="section-label">COLLECTIONS</span><button id="new-collection" class="text-button" aria-label="Create collection">+</button></div><div id="collections"></div></section>
<section><span class="section-label">TAGS</span><div id="side-tags"></div></section>
<section><span class="section-label">SAVED SEARCHES</span><select aria-label="Saved search" id="saved"></select><button id="save-search" class="text-button">+ Save current search</button></section>
  <div class="sidebar-bottom"><span class="avatar">LW</span><span>Local workshop<small>MVP 0.3.5</small></span></div>
</aside>
<main><header><div class="crumb">My workshop <span>/</span> <b id="breadcrumb">Library</b></div><div class="row"><span class="demo-label">MVP 0.3.5</span></div></header><p id="notice" role="status" aria-live="polite"></p><div class="page"><section id="library-page"><div class="page-heading"><div><span class="eyebrow">YOUR WORKSHOP</span><h1>Part library</h1></div><button id="create" class="primary">+ Create new part</button></div><div id="collection-heading"></div><div class="toolbar"><span id="count" role="status"></span><div class="row"><select id="sort" aria-label="Sort parts"><option value="name">Name A-Z</option><option value="number">Part number</option></select><button id="layout">Table view</button></div></div><nav id="library" aria-label="Parts"></nav></section><article id="detail" hidden></article><section id="reports-page" hidden></section></div></main>
<dialog id="dialog" aria-labelledby="title"><form id="form"><h2 id="title"></h2><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">Close</button><button class="primary" id="submit">Save</button></div></form></dialog>
<div id="message" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script></body></html>
